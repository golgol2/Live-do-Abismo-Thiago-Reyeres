[project]
name = "boneco-game"
version = "0.1.0"
description = "Jogo interativo do Boneco para live TikTok"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyMySQL>=1.1,<2",
  "python-socketio[client]>=5.11,<6",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<12",
]

[tool.setuptools.packages.find]
where = ["src"]
